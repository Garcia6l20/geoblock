[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["S603", "S607", "S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
